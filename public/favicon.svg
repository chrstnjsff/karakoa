  <circle cx="33" cy="24" r="4" fill="#ffffff"/>
  <!-- hull -->
  <path d="M8 36h48c-2 11-12 17-24 17S10 47 8 36z" fill="#e3a75b" stroke="#10324a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- wave -->
